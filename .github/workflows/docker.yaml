name: Gradle Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest   # or self-hosted if you use your EC2 runner
    steps:
      # 1. Checkout your repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Set up Java (Gradle needs JDK)
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Cache Gradle dependencies (optional, speeds up builds)
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      # 4. Run Gradle build
      - name: Build with Gradle
        run: ./gradlew build
